<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WangPaoPaoLab — 站点合集</title>
<meta name="description" content="WangPaoPaoLab 所有网站的总入口 / A single hub for every site I build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>

<a class="skip-link" href="#grid" data-en="Skip to sites" data-zh="跳到站点列表">跳到站点列表</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="./">
      <span class="logo-mark">W</span>
      <span class="logo-text">WangPaoPaoLab</span>
    </a>

    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / 切换语言">
        <span class="lang-en">EN</span><span class="lang-sep">/</span><span class="lang-zh">中</span>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme / 切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><g stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<main>

  <section class="hero">
    <div class="wrap">
      <h1 class="hero-title" data-en="Every site, one address." data-zh="所有站点，一个入口。">所有站点，一个入口。</h1>
      <p class="hero-desc"
         data-en="I keep building small websites. This page is the index — everything I've shipped lives here, so nothing gets lost again."
         data-zh="我一直在做各种小网站。这个页面就是目录 —— 我发布过的东西都收在这里，这样就不会再丢掉了。">我一直在做各种小网站。这个页面就是目录 —— 我发布过的东西都收在这里，这样就不会再丢掉了。</p>
      <p class="hero-stat" id="statLine"></p>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
  </section>

  <section class="toolbar">
    <div class="wrap toolbar-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21" stroke-linecap="round"/></svg>
        <input type="search" id="search"
               placeholder="搜索站点…"
               data-ph-en="Search sites…" data-ph-zh="搜索站点…"
               aria-label="Search sites / 搜索站点">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filter by category / 按分类筛选"></div>
    </div>
  </section>

  <section class="section" id="grid">
    <div class="wrap">
      <p class="empty" id="empty" hidden
         data-en="No sites match that filter."
         data-zh="没有符合条件的站点。">没有符合条件的站点。</p>

      <div class="site-grid" id="siteGrid">
        <p class="loading" id="loading"
           data-en="Loading…"
           data-zh="加载中…">加载中…</p>
      </div>

      <noscript>
        <p class="empty">This index needs JavaScript to render. / 这个目录需要 JavaScript 才能显示。</p>
      </noscript>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© <span id="year"></span> WangPaoPaoLab</p>
    <p class="footer-note">
      <span data-en="Data:" data-zh="数据：">数据：</span>
      <a href="data/sites.json">data/sites.json</a>
      <span class="sep">·</span>
      <a href="https://github.com/WangPaoPaoLab/WangPaoPaoLab.github.io" target="_blank" rel="noopener">GitHub</a>
    </p>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
