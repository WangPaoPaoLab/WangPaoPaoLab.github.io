<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在 / Page not found</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .notfound {
    min-height: 72vh;
    display: grid; place-content: center; justify-items: center;
    text-align: center; padding: 48px 24px;
  }
  .notfound-code {
    font-size: clamp(4rem, 16vw, 9rem); font-weight: 700; line-height: 1;
    margin: 0 0 .1em;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 38%, transparent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .notfound h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); }
  .notfound p { color: var(--text-muted); max-width: 44ch; }
  .notfound .back {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 10px; height: 44px; padding: 0 22px;
    font-size: 15px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 11px;
    transition: filter .18s ease;
  }
  .notfound .back:hover { filter: brightness(.96); }
</style>
</head>
<body>

  <main class="notfound">
    <p class="notfound-code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的地址没有对应的页面。<br>Page not found — that address doesn't exist.</p>
    <a class="back" href="/">回到站点索引 / Back to the index</a>
  </main>

</body>
</html>
